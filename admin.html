<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - IT Infrastructure Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .settings-container { max-width: 800px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .settings-section { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #e2e8f0; }
        .settings-section:last-child { border-bottom: none; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #003B5C; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #003B5C; color: white; }
        .btn-primary:hover { background: #002a42; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; color: #003B5C; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="settings-container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        <h1>Admin Settings</h1>
        
        <div class="settings-section">
            <h2>SAML Configuration</h2>
            <div class="form-group">
                <label>IdP Metadata URL</label>
                <input type="text" id="samlIdpUrl" placeholder="https://your-idp.com/metadata">
            </div>
            <div class="form-group">
                <label>Entity ID</label>
                <input type="text" id="samlEntityId" placeholder="it-infrastructure-tracker">
            </div>
            <button class="btn btn-primary" onclick="saveSAML()">Save SAML Config</button>
        </div>
        
        <div class="settings-section">
            <h2>Data Management</h2>
            <button class="btn btn-primary" onclick="clearAllData()" style="background: #dc2626;">Clear All Data</button>
        </div>
    </div>
    
    <script>
    function saveSAML() {
        var idpUrl = document.getElementById('samlIdpUrl').value;
        var entityId = document.getElementById('samlEntityId').value;
        if (!idpUrl || !entityId) { alert('Please fill all fields'); return; }
        var config = { idpUrl: idpUrl, entityId: entityId, enabled: true, configuredAt: new Date().toISOString() };
        localStorage.setItem('samlConfig', JSON.stringify(config));
        alert('SAML configuration saved!');
    }
    
    function clearAllData() {
        if (confirm('Clear ALL data? This cannot be undone.')) {
            localStorage.clear();
            alert('All data cleared!');
            window.location.reload();
        }
    }
    </script>
</body>
</html>
