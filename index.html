<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Infrastructure Activity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/performance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/offline-api.js"></script>
    <script src="js/api-client.js"></script>
</head>
<body>
    <div id="app">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-network-wired"></i>
                <span>IT Tracker</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-tab="dashboard">
                    <a href="#dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
                </li>
                <li class="nav-item" data-tab="projects">
                    <a href="#projects"><i class="fas fa-project-diagram"></i><span>Projects</span></a>
                </li>
                <li class="nav-item" data-tab="weekly-tasks">
                    <a href="#weekly-tasks"><i class="fas fa-calendar-week"></i><span>Weekly Tasks</span></a>
                </li>
                <li class="nav-item" data-tab="vulnerabilities">
                    <a href="#vulnerabilities"><i class="fas fa-shield-alt"></i><span>Vulnerabilities</span></a>
                </li>
                <li class="nav-item" data-tab="risks">
                    <a href="#risks"><i class="fas fa-exclamation-triangle"></i><span>Risk Register</span></a>
                </li>
                <li class="nav-item" data-tab="critical-tasks">
                    <a href="#critical-tasks"><i class="fas fa-exclamation-circle"></i><span>Critical Tasks</span></a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button id="sidebarToggle" class="sidebar-toggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
        </nav>
        
        <main class="main-content">
            <header class="main-header">
                <button id="menuToggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Dashboard</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" id="addItemBtn">
                        <i class="fas fa-plus"></i><span>Add New</span>
                    </button>
                    <div id="userDisplay"></div>
                </div>
            </header>
            
            <div class="content-area" id="contentArea">
                <!-- Dashboard View -->
                <div id="dashboard-view" class="view active">
                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <h3><i class="fas fa-project-diagram"></i> Projects</h3>
                            <p class="stat-number" id="projectCount">0</p>
                            <p class="stat-label">Active Projects</p>
                            <div class="chart-container">
                                <canvas id="projectChart"></canvas>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <h3><i class="fas fa-shield-alt"></i> Vulnerabilities</h3>
                            <p class="stat-number" id="vulnCount">0</p>
                            <p class="stat-label">Total Open</p>
                            <div class="chart-container">
                                <canvas id="vulnerabilityChart"></canvas>
                            </div>
                        </div>
                        <div class="dashboard-card">
                            <h3><i class="fas fa-tasks"></i> Weekly Tasks</h3>
                            <p class="stat-number" id="taskCount">0</p>
                            <p class="stat-label">This Week</p>
                        </div>
                        <div class="dashboard-card">
                            <h3><i class="fas fa-exclamation-triangle"></i> Risks</h3>
                            <p class="stat-number" id="riskCount">0</p>
                            <p class="stat-label">Active Risks</p>
                        </div>
                        <div class="dashboard-card">
                            <h3><i class="fas fa-exclamation-circle"></i> Critical Tasks</h3>
                            <p class="stat-number" id="criticalCount">0</p>
                            <p class="stat-label">Open Tasks</p>
                        </div>
                    </div>
                </div>
                
                <!-- Other views will be loaded dynamically -->
            </div>
        </main>
    </div>
    
    <div id="modalContainer" class="modal-container"></div>
    
    <script>
    // Simple app initialization
    (function() {
        var token = localStorage.getItem('token');
        var user = JSON.parse(localStorage.getItem('user') || 'null');
        window.isOfflineMode = !token || !user || (token && token.startsWith('offline_'));
        
        // User display
        if (user) {
            var userDisplay = document.getElementById('userDisplay');
            userDisplay.innerHTML = '<i class="fas fa-user"></i> ' + (user.fullName || user.username) + 
                ' <a href="#" onclick="localStorage.removeItem(\'token\');localStorage.removeItem(\'user\');window.location.reload();" style="color:white;margin-left:10px;">Logout</a>';
        }
        
        // Navigation
        document.querySelectorAll('.nav-item').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                var tab = this.dataset.tab;
                switchTab(tab);
            });
        });
        
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(function(i) { i.classList.remove('active'); });
            document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
            document.getElementById('pageTitle').textContent = tab.charAt(0).toUpperCase() + tab.slice(1).replace('-', ' ');
            loadTabContent(tab);
        }
        
        function loadTabContent(tab) {
            var contentArea = document.getElementById('contentArea');
            var views = {
                'dashboard': '<div class="dashboard-grid"><div class="dashboard-card"><h3><i class="fas fa-project-diagram"></i> Projects</h3><p class="stat-number" id="projectCount">0</p></div><div class="dashboard-card"><h3><i class="fas fa-shield-alt"></i> Vulnerabilities</h3><p class="stat-number" id="vulnCount">0</p></div><div class="dashboard-card"><h3><i class="fas fa-tasks"></i> Weekly Tasks</h3><p class="stat-number" id="taskCount">0</p></div><div class="dashboard-card"><h3><i class="fas fa-exclamation-triangle"></i> Risks</h3><p class="stat-number" id="riskCount">0</p></div><div class="dashboard-card"><h3><i class="fas fa-exclamation-circle"></i> Critical Tasks</h3><p class="stat-number" id="criticalCount">0</p></div></div>',
                'projects': '<div class="table-container"><table class="data-table"><thead><tr><th>Title</th><th>Status</th><th>Team</th><th>End Date</th><th>Actions</th></tr></thead><tbody id="projectsTableBody"></tbody></table></div>',
                'vulnerabilities': '<div class="table-container"><table class="data-table"><thead><tr><th>Title</th><th>Severity</th><th>Status</th><th>Assignment Group</th><th>Due Date</th><th>Actions</th></tr></thead><tbody id="vulnTableBody"></tbody></table></div>',
                'risks': '<div class="table-container"><table class="data-table"><thead><tr><th>Risk Description</th><th>Status</th><th>Actions</th></tr></thead><tbody id="risksTableBody"></tbody></table></div>',
                'weekly-tasks': '<div class="table-container"><table class="data-table"><thead><tr><th>Title</th><th>Team</th><th>Week</th><th>Actions</th></tr></thead><tbody id="tasksTableBody"></tbody></table></div>',
                'critical-tasks': '<div class="table-container"><table class="data-table"><thead><tr><th>Title</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody id="criticalTableBody"></tbody></table></div>'
            };
            contentArea.innerHTML = views[tab] || '<p>Tab not found</p>';
            loadData(tab);
        }
        
        function loadData(tab) {
            var endpoint = '/api/' + tab.replace('-', '/');
            fetch(endpoint, {
                headers: window.isOfflineMode ? {} : { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (Array.isArray(data)) {
                    updateTable(tab, data);
                    updateDashboardCounts(tab, data);
                }
            })
            .catch(function(e) { console.log('Load data error:', e); });
        }
        
        function updateTable(tab, rows) {
            var tbodyId = {
                'projects': 'projectsTableBody',
                'vulnerabilities': 'vulnTableBody',
                'risks': 'risksTableBody',
                'weekly-tasks': 'tasksTableBody',
                'critical-tasks': 'criticalTableBody'
            }[tab];
            var tbody = document.getElementById(tbodyId);
            if (!tbody) return;
            
            tbody.innerHTML = rows.map(function(row) {
                var actions = '<button class="edit-btn" data-id="' + row.id + '" data-tab="' + tab + '"><i class="fas fa-edit"></i></button>' +
                              '<button class="delete-btn" data-id="' + row.id + '" data-tab="' + tab + '"><i class="fas fa-trash"></i></button>';
                var cells = tab === 'projects' ? [row.title, row.status, row.assigned_team || '-', row.target_end_date || '-', actions] :
                           tab === 'vulnerabilities' ? [row.title, row.severity, row.status, row.assignment_group || '-', row.due_date || '-', actions] :
                           tab === 'risks' ? [row.risk_description, row.status, actions] :
                           tab === 'weekly-tasks' ? [row.title, row.assigned_team || '-', (row.week_number || '-') + '/' + (row.year || '-'), actions] :
                           [row.title, row.priority, row.status, actions];
                return '<tr>' + cells.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
            }).join('');
        }
        
        function updateDashboardCounts(tab, data) {
            var counts = { 'projectCount': data.length, 'vulnCount': data.length, 'taskCount': data.length, 'riskCount': data.length, 'criticalCount': data.length };
            Object.keys(counts).forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.textContent = counts[id] || 0;
            });
        }
        
        // Add button
        document.getElementById('addItemBtn').addEventListener('click', function() {
            alert('Add functionality - implement per tab');
        });
        
        // Initial load
        loadData('dashboard');
        
        console.log('App initialized');
    })();
    </script>
</body>
</html>
