<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Infrastructure Activity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/performance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="js/offline-api.js"></script>
    <script src="js/api-client.js"></script>
    <script>
        console.log('=== Application initializing ===');
        
        // Check if running in offline/standalone mode
        (function() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            
            if (token) {
                window.isOfflineMode = false;
            } else {
                window.isOfflineMode = true;
            }
            
            if (window.isOfflineMode) {
                console.log('Running in OFFLINE mode - using localStorage');
                localStorage.setItem('token', 'offline_token');
                localStorage.setItem('user', JSON.stringify({
                    id: 'offline-user',
                    username: 'localuser',
                    fullName: 'Local User',
                    role: 'admin'
                }));
                
                const offlineIndicator = document.createElement('div');
                offlineIndicator.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#28a745;color:white;padding:5px 10px;border-radius:5px;z-index:1000;font-size:12px;';
                offlineIndicator.innerHTML = '<i class="fas fa-wifi-slash"></i> Offline Mode <a href="login.html" style="color:white;margin-left:10px;">Login</a>';
                document.addEventListener('DOMContentLoaded', () => {
                    document.body.appendChild(offlineIndicator);
                });
            } else {
                console.log('Running in ONLINE mode - using backend API');
                
                const userDisplay = document.createElement('div');
                userDisplay.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#003B5C;color:white;padding:5px 10px;border-radius:5px;z-index:1000;font-size:12px;';
                userDisplay.innerHTML = `<i class="fas fa-user"></i> ${user.fullName || user.username} <a href="#" onclick="localStorage.removeItem('token');localStorage.removeItem('user');window.location.reload();" style="color:white;margin-left:10px;">Logout</a>`;
                document.addEventListener('DOMContentLoaded', () => {
                    document.body.appendChild(userDisplay);
                });
            }
            
            console.log('Application initialized - Dashboard loaded');
        })();
    </script>
</head>
