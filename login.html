<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Infrastructure Activity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #003B5C 0%, #004d7a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 420px;
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo h1 { color: #003B5C; font-size: 1.5rem; font-weight: 700; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #003B5C; }
        .btn {
            width: 100%;
            padding: 0.875rem;
            background: #003B5C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.75rem;
        }
        .btn:hover { background: #002a42; }
        .btn-sso { background: #FFD700; color: #003B5C; }
        .btn-sso:hover { background: #FFC107; }
        .btn-offline { background: #28a745; }
        .btn-offline:hover { background: #218838; }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }
        .sso-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        .sso-section p { color: #666; font-size: 0.9rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>IT Infrastructure Tracker</h1>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        
        <button class="btn" id="loginButton">Login</button>
        
        <div class="sso-section">
            <p>Or login with</p>
            <button class="btn btn-sso" id="ssoButton">Company SSO</button>
        </div>
        
        <div class="sso-section">
            <p>No server available?</p>
            <button class="btn btn-offline" id="offlineButton">Use Offline Mode</button>
        </div>
    </div>
    
    <script>
    document.getElementById('loginButton').addEventListener('click', function() {
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var errorDiv = document.getElementById('errorMessage');
        
        if (!username || !password) {
            errorDiv.textContent = 'Username and password are required.';
            errorDiv.style.display = 'block';
            return;
        }
        
        errorDiv.style.display = 'none';
        
        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (res.ok && data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                document.cookie = 'auth_token=Bearer ' + data.token + '; path=/; SameSite=Lax; Max-Age=86400';
                window.location.replace('/index.html');
            } else {
                errorDiv.textContent = data.error || 'Login failed.';
                errorDiv.style.display = 'block';
            }
        })
        .catch(function() {
            errorDiv.innerHTML = 'Cannot connect to server. Use Offline Mode below.';
            errorDiv.style.display = 'block';
        });
    });
    
    document.getElementById('ssoButton').addEventListener('click', function() {
        window.location.href = '/api/auth/saml';
    });
    
    document.getElementById('offlineButton').addEventListener('click', function() {
        localStorage.setItem('token', 'offline_token');
        localStorage.setItem('user', JSON.stringify({
            id: 'offline-user',
            username: 'localuser',
            fullName: 'Local User',
            role: 'admin'
        }));
        window.location.replace('/index.html');
    });
    
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('loginButton').click();
    });
    
    // Check SAML config
    if (!localStorage.getItem('samlConfig')) {
        document.getElementById('ssoButton').style.display = 'none';
    }
    </script>
</body>
</html>
