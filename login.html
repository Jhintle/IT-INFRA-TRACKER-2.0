<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Infrastructure Activity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #003B5C 0%, #004d7a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            min-width: 350px;
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            height: 50px;
            margin-bottom: 0.75rem;
        }

        .logo h1 {
            color: #003B5C;
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.3;
            text-align: center;
            width: 100%;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #003B5C;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #003B5C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #002a42;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .sso-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }

        .sso-btn {
            background: #FFD700;
            color: #003B5C;
            margin-top: 1rem;
        }

        .sso-btn:hover {
            background: #FFC107;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form id="loginForm">
            <div class="logo">
                <img src="assets/sipchem-logo.svg" alt="Sipchem" onerror="this.style.display='none'">
                <h1>IT Infrastructure Tracker</h1>
            </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <form id="loginForm">
                <input type="password" id="password" required placeholder="Enter your password">
        </div>

        <button type="button" class="btn" id="loginButton">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>

        <div class="sso-section" id="ssoSection">
            <p>Or login with</p>
            <a href="/api/auth/saml" class="btn sso-btn">
                <i class="fas fa-building"></i> Company SSO
            </a>
        </div>

        <div class="sso-section" style="margin-top: 1.5rem; padding-top: 1.5rem;">
            <p style="font-size: 0.875rem; color: #666;">No server available?</p>
            <button type="button" class="btn" style="background: #28a745; margin-top: 0.5rem;" onclick="useOfflineMode()">
                <i class="fas fa-wifi-slash"></i> Use Offline Mode
            </button>
        </div>
    </form>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Check if SAML is configured
        const samlConfig = localStorage.getItem('samlConfig');
        const ssoSection = document.getElementById('ssoSection');
        
        if (samlConfig && ssoSection) {
            try {
                const config = JSON.parse(samlConfig);
                if (config.enabled) {
                    ssoSection.style.display = 'block';
                    console.log('SAML SSO is configured and enabled');
                }
            } catch (e) {
                console.error('Invalid SAML config:', e);
            }
        } else {
            // Hide SSO section if not configured
            if (ssoSection) {
                ssoSection.style.display = 'none';
            }
        }
        
        const loginBtn = document.getElementById('loginButton');
        const errorDiv = document.getElementById('errorMessage');

        loginBtn.addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorDiv.textContent = 'Username and password are required.';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            try {
                console.log('Attempting login for:', username);
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    console.log('Login SUCCESS - Token received:', data.token);
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Also set cookie for backend auth - Chrome compatible (no Secure for http://localhost)
                    document.cookie = `auth_token=Bearer ${data.token}; path=/; SameSite=Lax; Max-Age=86400`;
                    
                    console.log('Cookie set:', document.cookie);
                    console.log('Token stored:', data.token ? 'YES' : 'NO');
                    
                    console.log('Redirecting to dashboard...');
                    // Small delay to ensure cookie is set
                    setTimeout(() => {
                        window.location.replace('/index.html');
                    }, 100);
                } else {
                    console.log('Login failed:', data);
                    errorDiv.textContent = data.error || 'Login failed. Please check your credentials.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.innerHTML = 'Cannot connect to authentication server.<br>Please check your connection or use <strong>Offline Mode</strong> below.';
                errorDiv.style.display = 'block';
            }
        });
    });

    // Offline mode function
    function useOfflineMode() {
        // Set offline mode flag
        localStorage.setItem('token', 'offline_token');
        localStorage.setItem('user', JSON.stringify({
            id: 'offline-user',
            username: 'localuser',
            fullName: 'Local User',
            role: 'admin'
        }));
        
        console.log('Switching to offline mode...');
        window.location.replace('/index.html');
    }
    </script>
</body>
</html>
